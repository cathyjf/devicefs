name: Install WinFsp
description: Install the WinFsp runtime and development files.

runs:
  using: composite
  steps:
    - name: Download, verify, and install WinFsp
      uses: $/.github/actions/install-msi
      with:
        uri: https://github.com/winfsp/winfsp/releases/download/v2.2/winfsp-2.2.26323.msi
        sha256: 36CE01F9EEDBBE6842B7FB4BEDC79D7D4F71983E8ACEB6877B46A07B331C7E19
        arguments: ADDLOCAL=F.Main,F.User,F.Developer
