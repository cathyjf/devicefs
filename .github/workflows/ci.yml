name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025-vs2026
            builder_runner: ubuntu-26.04
          - architecture: arm64
            runner: windows-11-vs2026-arm
            builder_runner: ubuntu-26.04-arm
    uses: $/.github/workflows/windows-ci-suite.yml
    with:
      architecture: ${{ matrix.architecture }}
      runner: ${{ matrix.runner }}
      builder_runner: ${{ matrix.builder_runner }}

  unix:
    name: unix-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            runner: xcode-27
          - os: gnu-linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Acquire toolchains
            run: |
              export HOMEBREW_NO_ASK=1
              packages=(llvm lld gcc)
              [[ $(uname) == 'Darwin' ]] || {
                eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                # Note: glibc must be installed before gcc.
                packages=(cmake glibc "${packages[@]}")
              }
              brew install "${packages[@]}"

      - parallel:
          - name: Run terminal tests with the LLVM/libc++ toolchain
            uses: $/.github/actions/run-unix-terminal-tests
            with:
              preset: unix

          - name: Run terminal tests with the GCC/libstdc++ toolchain
            uses: $/.github/actions/run-unix-terminal-tests
            with:
              preset: unix-gcc
