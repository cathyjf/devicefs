name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: windows-${{ matrix.architecture }}-privileged
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: &test_matrix
        include:
          - architecture: x64
            runner: windows-2025-vs2026
            builder_runner: ubuntu-26.04
          - architecture: arm64
            runner: windows-11-vs2026-arm
            builder_runner: ubuntu-26.04-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
        background: true

      # Some tests require a specific lock file to exist in the filesystem.
      - name: Create lock file
        run: |
          $credentials_dir = [IO.Path]::Combine( `
            $env:ProgramData, 'devicefs', 'credentials')
          [IO.Directory]::CreateDirectory($credentials_dir) | Out-Null
          [IO.File]::Open([IO.Path]::Combine($credentials_dir, `
            'pbs-vss-backup.lock'), [IO.FileMode]::OpenOrCreate).Dispose()
        background: true

      # The `windows-2025-vs2026` runner includes WinGet.
      # The `windows-11-vs2026-arm` runner does not include WinGet.
      - name: Install WinGet
        if: matrix.runner == 'windows-11-vs2026-arm'
        run: |
          Install-Module Microsoft.WinGet.Client -Repository PSGallery `
            -Force -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers -Latest -Verbose
        env:
          # GitHub rate limiting can prevent acquisition of WinGet.
          # Supplying a GitHub token can mitigate that issue.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Windows ADK deployment tools
        run: |
          winget install -e --id Microsoft.WindowsADK --source winget `
            --silent --accept-package-agreements --accept-source-agreements `
            --custom "/features OptionId.DeploymentTools"

      - name: Install WinFsp
        run: |
          winget install -e --id WinFsp.WinFsp --source winget `
            --silent --accept-package-agreements --accept-source-agreements `
            --custom "ADDLOCAL=F.Main,F.User,F.Developer"

      - name: Wait for preparation to finish
        wait-all:

      - name: Configure
        run: |
          cmake --preset windows-${{ matrix.architecture }} `
            -DDEVICEFS_TERMINAL_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-${{ matrix.architecture }}-release

      # Some tests require standard input to be attached to a console.
      # To satisfy that need, we run `ctest` inside `conhost.exe`.
      # This requires creating a temporary file to collect the exit status.
      - name: Test
        run: |
          $env:DEVICEFS_CTEST_RESULT = Join-Path $env:RUNNER_TEMP `
            "ctest-$([guid]::NewGuid()).exit"

          $start = [Diagnostics.ProcessStartInfo]::new('conhost.exe')
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardInput = $true
          foreach ($argument in @(
            '--headless', 'pwsh', '-NoProfile', '-NonInteractive', '-Command',
            (
              '$ErrorActionPreference = "Stop"; ' +
              'ctest --preset windows-${{ matrix.architecture }}-privileged; ' +
              '$LASTEXITCODE | Set-Content -LiteralPath $env:DEVICEFS_CTEST_RESULT'
            )
          )) {
            $start.ArgumentList.Add($argument)
          }

          $process = [Diagnostics.Process]::Start($start)
          try {
            $process.WaitForExit()
          } finally {
            $process.Dispose()
          }

          exit [int](Get-Content -LiteralPath $env:DEVICEFS_CTEST_RESULT `
            -ErrorAction Stop)

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.architecture }}-test-logs
          path: build/windows-${{ matrix.architecture }}/Testing/Temporary/

  build-wsl-rootfs:
    name: wsl-rootfs-${{ matrix.architecture }}
    runs-on: ${{ matrix.builder_runner }}
    strategy:
      fail-fast: false
      matrix: *test_matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the WSL1 test rootfs
        run: |
          sudo podman build \
            --network host --jobs 0 --target samba-helper-tests \
            --output "type=tar,dest=${RUNNER_TEMP}/wsl1-test-rootfs.tar" \
            --volume "${GITHUB_WORKSPACE}:/usr/src/devicefs:ro" \
            "${GITHUB_WORKSPACE}/src/wsl"

      - name: Upload the WSL1 test rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-rootfs-${{ matrix.architecture }}
          path: ${{ runner.temp }}/wsl1-test-rootfs.tar
          if-no-files-found: error

  test-wsl:
    name: wsl-${{ matrix.architecture }}
    needs: build-wsl-rootfs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: *test_matrix
    defaults:
      run:
        shell: pwsh
    steps:
      # The `windows-2025-vs2026` runner includes WSL.
      # The `windows-11-vs2026-arm` runner does not include WSL.
      - parallel:
          - name: Acquire and install the WSL package
            if: matrix.runner == 'windows-11-vs2026-arm'
            run: |
              $wsl_path = New-TemporaryFile
              Invoke-WebRequest `
                -Uri (
                  'https://github.com/microsoft/WSL/releases/download/3.0.1/' +
                  'wsl.3.0.1.0.arm64.msi') `
                -OutFile $wsl_path
              $expected_hash = (
                '857ddbb335ec7d05ffa71d0fd2203750' +
                'c0e8fc29bb164f8a95db92bd7bba4263')
              $hash = (Get-FileHash -LiteralPath $wsl_path `
                -Algorithm SHA256).Hash
              if ($hash -ne $expected_hash) {
                throw "WSL MSI SHA-256 mismatch: expected $expected_hash; " +
                  "got $hash."
              }
              $wsl_log = New-TemporaryFile
              try {
                $PSNativeCommandUseErrorActionPreference = $true
                msiexec.exe /i $wsl_path /qn REBOOT=ReallySuppress `
                  /L*V $wsl_log | Out-Host
              } catch {
                Get-Content -LiteralPath $wsl_log | Out-Host
                throw
              }

          - name: Enable the WSL1 component
            if: matrix.runner == 'windows-11-vs2026-arm'
            run: |
              dism.exe /online /enable-feature `
                /featurename:Microsoft-Windows-Subsystem-Linux /all

          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

          - name: Download the WSL1 test rootfs
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: wsl-rootfs-${{ matrix.architecture }}
              path: ${{ runner.temp }}/wsl-rootfs

      - name: Test the DeviceFs `samba_rpc` helper under WSL1
        run: |
          ./.github/scripts/Test-SambaRpcWsl.ps1 `
            -rootfs "$env:RUNNER_TEMP/wsl-rootfs/wsl1-test-rootfs.tar" `
            -logs_directory "$env:RUNNER_TEMP/wsl-test-logs"

      - name: Upload WSL1 test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-${{ matrix.architecture }}-test-logs
          path: ${{ runner.temp }}/wsl-test-logs/Testing/Temporary/
