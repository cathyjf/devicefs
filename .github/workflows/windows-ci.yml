name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: windows-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025-vs2026
            builder_runner: ubuntu-26.04
          - architecture: arm64
            runner: windows-11-vs2026-arm
            builder_runner: ubuntu-26.04-arm
    uses: $/.github/workflows/windows-ci-suite.yml
    with:
      architecture: ${{ matrix.architecture }}
      runner: ${{ matrix.runner }}
      builder_runner: ${{ matrix.builder_runner }}
